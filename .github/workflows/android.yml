name: Android Build APK

on:
  push:
    branches: [ "**" ] # Se activa en cualquier rama para facilitar las pruebas
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Compile Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK and AAB Bundle
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload Release APK (Para instalar en tu celular)
        uses: actions/upload-artifact@v4
        with:
          name: WallFlow-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload Release AAB (Para subir a Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: WallFlow-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
